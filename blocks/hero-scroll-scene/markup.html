<section class="hero-scroll" aria-labelledby="{{anchor}}-title" id="{{anchor}}" data-block="hero-scroll-scene"><div class="hero-sticky"><div class="hero-grid"><div class="hero-visual"><img class="hero-city" src="assets/hero-city.png" alt="{{image_alt}}"/><div class="city-light"></div><div class="birth-structure birth-one" aria-hidden="true"><span><i></i></span><b></b></div><div class="birth-structure birth-two" aria-hidden="true"><span><i></i></span><b></b></div><div class="birth-structure birth-three" aria-hidden="true"><span><i></i></span><b></b></div><div class="hero-car" aria-hidden="true"><i></i><b></b></div><div class="hero-visual-top"><span class="version-badge">{{badges.version}}</span><span class="live-badge"><i></i> {{badges.live}}</span></div><a class="start-action" href="{{scroll_hint.href}}"><span>{{scroll_hint.label}}</span><i>↓</i></a><div class="birth-meter" aria-label="{{meter_label}}"><span></span><span></span><span></span></div></div><div class="hero-copy"><p class="eyebrow">{{eyebrow}}</p><h1 id="{{anchor}}-title">{{title}}</h1><p class="hero-lead">{{lead}}</p><div class="hero-actions"><a class="primary-button" href="{{primary.href}}"><span>{{primary.label}}</span><i>←</i></a><button class="text-button contact-link" type="button">{{secondary.label}}</button></div><div class="hero-proof">{{#proof}}<span>{{value}}</span>{{/}}</div></div></div></div></section>
