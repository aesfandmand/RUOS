<section class="structure-hero" id="{{anchor}}" data-block="structure-hero"><div class="structure-hero-media">{{?image}}<img src="{{image.src}}" alt="{{image.alt}}" loading="eager">{{/}}{{^image}}{{?diagram}}<div class="structure-diagram" role="img" aria-label="{{diagram.aria_label}}"><span class="structure-diagram-box" style="aspect-ratio:{{diagram.ratio}}"><i class="structure-diagram-height">{{diagram.height_label}}</i><i class="structure-diagram-width">{{diagram.width_label}}</i></span></div>{{/}}{{/}}</div><div class="structure-hero-copy"><p class="eyebrow">{{eyebrow}}</p><h1>{{title}}</h1><p>{{lead}}</p>{{?dimension_label}}<p class="structure-hero-dimension">{{dimension_label}}</p>{{/}}{{?primary}}<button class="primary-button contact-link" type="button"><span>{{primary.label}}</span><i>←</i></button>{{/}}</div></section>
