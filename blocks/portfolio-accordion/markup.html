<section class="pfa" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="portfolio-accordion" data-cursor="default"><div class="content-shell"><header class="pfa-head">{{?eyebrow}}<p class="eyebrow">{{eyebrow}}</p>{{/}}<h2 id="{{anchor}}-title">{{title}}</h2>{{?lead}}<p class="pfa-lead">{{lead}}</p>{{/}}</header><div class="pfa-row" data-reveal>{{#panels}}<article class="pfa-panel" data-i="{{@}}"><button type="button" class="pfa-tab" aria-expanded="true" aria-controls="{{anchor}}-p{{@}}" id="{{anchor}}-t{{@}}"><span class="pfa-num">{{index}}</span><span class="pfa-name">{{title}}</span></button><div class="pfa-open" id="{{anchor}}-p{{@}}" role="region" aria-labelledby="{{anchor}}-t{{@}}"><figure class="pfa-shot img-slot">{{?src}}<img src="{{src}}" alt="{{alt}}" loading="lazy">{{/}}{{^src}}<span class="img-slot-copy"><strong>{{label}}</strong><span>{{alt}}</span></span>{{/}}</figure><div class="pfa-card"><h3><span class="icon-badge pfa-ico"><svg aria-hidden="true"><use href="#{{icon}}"></use></svg></span>{{title}}</h3>{{?body}}<p class="pfa-body"{{?placeholder}} data-placeholder="accordion"{{/}}>{{body}}</p>{{/}}<ul class="pfa-links">{{#links}}<li><a href="{{href}}">{{label}}</a></li>{{/}}</ul><a class="pfa-all" href="{{href}}"><span>{{cta}}</span><svg aria-hidden="true"><use href="#icon-arrow-left"></use></svg></a></div></div></article>{{/}}</div></div></section>
