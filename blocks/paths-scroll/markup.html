<section class="paths-scroll" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="paths-scroll"><div class="paths-sticky"><div class="paths-shell"><header class="paths-header"><div><p class="eyebrow">{{eyebrow}}</p><h2 id="{{anchor}}-title">{{title}}</h2></div><p class="paths-instruction"><span>{{instruction.lead}}</span><b>{{instruction.strong}}</b></p></header><div class="path-stepper" aria-label="پیشرفت سه مسیر">{{#paths}}<button type="button" aria-label="نمایش مسیر {{@n}}: {{title}}"><span>{{@nn}}</span><i></i></button>{{/}}</div><div class="path-viewport">{{#paths}}<article class="path-card" data-path="{{@n}}" aria-hidden="true"><span class="path-large-number" aria-hidden="true">{{@nn}}</span><div class="path-card-copy"><p>{{kicker}}</p><h3>{{title}}</h3><div class="path-summary">{{summary}}</div><ul>{{#points}}<li>{{value}}</li>{{/}}</ul><strong class="path-result">{{result}}</strong></div></article>{{/}}</div></div></div></section>
