<section class="service-map" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="service-map" data-cursor="default"><div class="content-shell"><header class="split-heading"><div><p class="eyebrow">{{eyebrow}}</p><h2 id="{{anchor}}-title">{{title}}</h2></div><div class="heading-aside"><p>{{aside}}</p></div></header><div class="service-filter-row">{{?filter_label}}<p class="service-filter-label" id="{{anchor}}-filter">{{filter_label}}</p>{{/}}<div class="service-filters" role="group" aria-labelledby="{{anchor}}-filter">{{#filters}}<button type="button" class="service-filter" data-filter="{{value}}" aria-pressed="false">{{label}}</button>{{/}}</div></div><div class="service-grid" data-reveal-group>{{#services}}<article class="service-card" data-groups="{{groups}}" data-reveal><figure class="service-shot img-slot">{{?src}}<img src="{{src}}" alt="{{alt}}" loading="lazy">{{/}}{{^src}}<span class="img-slot-copy"><strong>{{label}}</strong><span>{{alt}}</span></span>{{/}}{{?badge}}<small class="service-badge">{{badge}}</small>{{/}}</figure><div class="service-body"><span class="icon-badge service-ico"><svg aria-hidden="true"><use href="#{{icon}}"></use></svg></span><h3>{{title}}</h3><p class="service-qualifier">{{qualifier}}</p><p class="service-body-copy"{{?placeholder}} data-placeholder="service"{{/}}>{{body}}</p><ul class="service-points">{{#points}}<li>{{value}}</li>{{/}}</ul><a class="service-link" href="{{href}}" aria-label="{{link_aria}}"><span>{{link_label}}</span><svg aria-hidden="true"><use href="#icon-chevron-left"></use></svg></a></div></article>{{/}}</div></div></section>
