<section class="ed-split{{?flip}} is-flipped{{/}}" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="editorial-split">
<div class="content-shell ed-split-inner">
<div class="ed-copy" data-reveal-group>{{?eyebrow}}<p class="eyebrow" data-reveal>{{eyebrow}}</p>{{/}}<h2 id="{{anchor}}-title" data-reveal>{{title}}</h2>{{#body}}<p data-reveal>{{value}}</p>{{/}}</div>
{{?image}}<figure class="ed-shot img-slot" data-reveal="mask">{{?image.src}}<img src="{{image.src}}" alt="{{image.alt}}">{{/}}{{^image.src}}<span class="img-slot-copy"><strong>{{image.label}}</strong><span>{{image.alt}}</span></span>{{/}}</figure>{{/}}
</div>
</section>
