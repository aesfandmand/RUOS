<section class="wk" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="workshop-gallery">
<div class="content-shell">
{{?eyebrow}}<p class="eyebrow">{{eyebrow}}</p>{{/}}
<h2 id="{{anchor}}-title">{{title}}</h2>
{{?lead}}<p class="wk-lead">{{lead}}</p>{{/}}
<div class="wk-grid">{{#items}}<figure class="img-slot wk-cell" data-reveal>{{?src}}<img src="{{src}}" alt="{{alt}}">{{/}}{{^src}}<span class="img-slot-copy"><strong>{{label}}</strong><span>{{alt}}</span></span>{{/}}</figure>{{/}}</div>
</div>
</section>
