<section class="spec" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="spec-table">
<div class="content-shell">
{{?eyebrow}}<p class="eyebrow" data-reveal>{{eyebrow}}</p>{{/}}
<h2 id="{{anchor}}-title" data-reveal><svg class="h-ico" aria-hidden="true"><use href="#icon-datasheet"></use></svg>{{title}}</h2>
{{?lead}}<p class="spec-lead">{{lead}}</p>{{/}}
<div class="spec-scroll" data-reveal><table class="spec-table"><thead><tr><th scope="col">مشخصه</th>{{#columns}}<th scope="col">{{value}}</th>{{/}}</tr></thead><tbody>{{#rows}}<tr><th scope="row">{{label}}</th>{{#values}}<td{{?placeholder}} data-placeholder="spec"{{/}}>{{value}}</td>{{/}}</tr>{{/}}</tbody></table></div>
{{?footnote}}<p class="spec-foot">{{footnote}}</p>{{/}}
</div>
</section>
