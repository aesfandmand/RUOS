<section class="assessment-section" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="assessment-section"><div class="content-shell assessment-shell"><header class="assessment-intro"><p class="eyebrow">{{eyebrow}}</p><h2 id="{{anchor}}-title">{{title}}</h2><p>{{lead}}</p><div class="assessment-progress" aria-label="{{progress_label}}"><i style="width:0%"></i></div></header><div class="assessment-board"><div class="assessment-questions">{{#questions}}<fieldset data-question="{{@n}}"><legend><span aria-hidden="true">{{@nn}}</span><strong>{{legend}}</strong></legend><p>{{note}}</p><div class="assessment-options">{{#options}}<button type="button" aria-pressed="false" data-score="{{score}}"><span>{{label}}</span><small>{{note}}</small><i aria-hidden="true"></i></button>{{/}}</div></fieldset>{{/}}</div><aside class="assessment-result" aria-live="polite"><small>{{result.kicker}}</small><h3 data-result-title>{{result.title}}</h3><p data-result-body>{{result.body}}</p><button class="primary-button contact-link" type="button"><span>{{result.cta}}</span><i>←</i></button></aside></div></div></section>
