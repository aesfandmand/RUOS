<section class="structure-services" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="structure-services"><div class="content-shell"><header class="section-intro section-intro--right"><p class="eyebrow">{{eyebrow}}</p><h2 id="{{anchor}}-title">{{title}}</h2><p>{{lead}}</p></header><ul class="structure-services-list" data-reveal-group>{{#services}}<li data-reveal><figure class="structure-service-shot img-slot">{{?src}}<img src="{{src}}" alt="{{alt}}" loading="lazy">{{/}}{{^src}}<span class="img-slot-copy"><strong>{{label}}</strong><span>{{alt}}</span></span>{{/}}</figure><div class="structure-service-copy"><span class="icon-badge structure-service-ico"><svg aria-hidden="true"><use href="#icon-services"></use></svg></span><strong>{{title}}</strong><span class="structure-service-note">{{note}}</span><p{{?placeholder}} data-placeholder="service"{{/}}>{{body}}</p></div></li>{{/}}</ul></div></section>
