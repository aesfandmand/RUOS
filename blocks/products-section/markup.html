<section class="products-section" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="products-section"><div class="content-shell"><header class="split-heading"><div><p class="eyebrow">{{eyebrow}}</p><h2 id="{{anchor}}-title">{{title}}</h2></div><div class="heading-aside"><p>{{aside}}</p>{{?cta}}<a href="{{cta.href}}">{{cta.label}}</a>{{/}}</div></header><div class="product-toolbar" aria-label="فیلتر سازه‌ها">{{#filters}}<button type="button" data-filter="{{value}}" aria-pressed="false">{{label}}</button>{{/}}</div><div class="products-grid">{{#products}}<article class="product-card" id="card-{{id}}" data-group="{{group}}"><div class="product-visual product-visual--{{variant}}" role="img" aria-label="{{alt}}"><span class="product-sun"></span><span class="product-skyline product-skyline-a"></span><span class="product-skyline product-skyline-b"></span><span class="product-road"></span><span class="product-post product-post-a"></span><span class="product-post product-post-b"></span><span class="product-frame"><i></i></span><span class="product-flowerbed"></span><span class="product-person"></span><small>{{badge}}</small></div><div class="product-card-copy"><div class="product-meta"><span>{{meta.kind}}</span><small>{{meta.size}}</small><b>{{meta.use}}</b></div><h3>{{title}}</h3><dl>{{#specs}}<div><dt>{{dt}}</dt><dd>{{dd}}</dd></div>{{/}}</dl><p class="selection-note"><strong>{{note.label}}</strong> {{note.text}}</p><a href="#card-{{id}}" aria-label="{{link_aria}}">{{link_label}}</a></div></article>{{/}}</div></div></section>
