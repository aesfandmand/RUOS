<section class="opportunity-section" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="opportunity-section"><div class="section-intro"><p class="eyebrow">{{eyebrow}}</p><h2 id="{{anchor}}-title">{{title}}</h2><p>{{lead}}</p></div><div class="opportunity-list">{{#stories}}<article class="location-story" data-opportunity="true"><div class="micro-scene micro-{{scene}}" aria-hidden="true"><span class="micro-sky"></span><span class="micro-road"></span>{{{scene_parts}}}<span class="scene-caption">{{caption}}</span></div><div class="location-copy"><span class="location-number" aria-hidden="true">{{@nn}}</span><div><h3>{{title}}</h3><p>{{body}}</p><strong>{{note}}</strong></div></div></article>{{/}}</div></section>
