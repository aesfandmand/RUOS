<section class="service-cf" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="service-coverflow" data-cursor="drag"><div class="content-shell service-cf-head"><p class="eyebrow">{{eyebrow}}</p><h2 id="{{anchor}}-title">{{title}}</h2><p>{{lead}}</p></div><div class="service-cf-stage"><div class="service-cf-swiper swiper"><div class="swiper-wrapper">{{#items}}<article class="swiper-slide service-cf-card"><figure class="service-cf-shot img-slot">{{?src}}<img src="{{src}}" alt="{{alt}}" loading="lazy">{{/}}{{^src}}<span class="img-slot-copy"><strong>{{label}}</strong><span>{{alt}}</span></span>{{/}}<span class="service-cf-index" aria-hidden="true">{{@nn}}</span></figure><div class="service-cf-copy"><p class="service-cf-kicker">{{kicker}}</p><h3>{{title}}</h3><p class="service-cf-body"{{?placeholder}} data-placeholder="solution"{{/}}>{{body}}</p><ul class="service-cf-points">{{#points}}<li>{{value}}</li>{{/}}</ul><a class="service-cf-link" href="{{href}}">{{link_label}}</a></div></article>{{/}}</div></div><div class="service-cf-controls"><button class="service-cf-prev" type="button" aria-label="{{?prev_label}}{{prev_label}}{{/}}{{^prev_label}}راهکار قبلی{{/}}"><svg aria-hidden="true"><use href="#icon-chevron-right"></use></svg></button><div class="service-cf-pagination"></div><button class="service-cf-next" type="button" aria-label="{{?next_label}}{{next_label}}{{/}}{{^next_label}}راهکار بعدی{{/}}"><svg aria-hidden="true"><use href="#icon-chevron-left"></use></svg></button></div></div></section>
