<section class="chk" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="checklist-section">
<div class="content-shell">
{{?eyebrow}}<p class="eyebrow" data-reveal>{{eyebrow}}</p>{{/}}
<h2 id="{{anchor}}-title" data-reveal>{{title}}</h2>
{{?lead}}<p class="chk-lead">{{lead}}</p>{{/}}
<ul class="chk-list" data-reveal-group>{{#items}}<li data-reveal><svg class="chk-tick" aria-hidden="true"><use href="#icon-check"></use></svg><span{{?placeholder}} data-placeholder="checklist"{{/}}>{{value}}</span></li>{{/}}</ul>
{{?note}}<aside class="chk-note" data-reveal><strong>{{note.title}}</strong><p>{{note.body}}</p></aside>{{/}}
</div>
</section>
