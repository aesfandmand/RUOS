<section class="lead" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="lead-form">
<div class="content-shell">
{{?eyebrow}}<p class="eyebrow" data-reveal>{{eyebrow}}</p>{{/}}
<h2 id="{{anchor}}-title" data-reveal>{{title}}</h2>
{{?lead}}<p class="lead-intro">{{lead}}</p>{{/}}
<form class="lead-form" novalidate data-reveal-group>{{#fields}}<div class="lead-field" data-reveal><label for="lead-{{name}}">{{label}}</label>{{?multiline}}<textarea id="lead-{{name}}" name="{{name}}" rows="3" placeholder="{{placeholder}}" required></textarea>{{/}}{{^multiline}}<input id="lead-{{name}}" name="{{name}}" type="{{type}}" inputmode="{{inputmode}}" autocomplete="{{autocomplete}}" placeholder="{{placeholder}}" required>{{/}}</div>{{/}}
<button class="primary-button lead-submit" type="submit">{{submit}}</button>
<p class="lead-status" role="status" aria-live="polite"></p></form>
{{?aside}}<aside class="lead-aside" data-reveal><h3>{{aside.title}}</h3><p>{{aside.body}}</p>{{?aside.note}}<p class="placeholder-chip" data-placeholder="price">{{aside.note}}</p>{{/}}{{?aside.cta}}<a class="lead-aside-cta" href="{{aside.cta.href}}">{{aside.cta.label}}</a>{{/}}</aside>{{/}}
</div>
</section>
