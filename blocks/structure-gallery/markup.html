<section class="structure-gallery" id="{{anchor}}" aria-labelledby="{{anchor}}-title" data-block="structure-gallery"><div class="content-shell structure-gallery-head"><p class="eyebrow">{{eyebrow}}</p><h2 id="{{anchor}}-title">{{title}}</h2><p>{{lead}}</p></div><div class="structure-gallery-stage"><div class="structure-gallery-swiper swiper"><div class="swiper-wrapper">{{#items}}<div class="swiper-slide structure-gallery-card"><img src="{{src}}" alt="{{alt}}" loading="lazy"><span class="structure-gallery-credit">{{caption}}</span></div>{{/}}</div><div class="structure-gallery-pagination"></div></div><button class="structure-gallery-prev" type="button" aria-label="مورد قبلی"><svg aria-hidden="true"><use href="#icon-chevron-right"></use></svg></button><button class="structure-gallery-next" type="button" aria-label="مورد بعدی"><svg aria-hidden="true"><use href="#icon-chevron-left"></use></svg></button></div></section>
