<header class="pf-hero" id="{{anchor}}" data-block="portfolio-hero" data-cursor="default"><div class="content-shell pf-crumb-row"><nav class="pf-crumb" aria-label="مسیر صفحه">{{#breadcrumb}}<a href="{{href}}">{{label}}</a>{{/}}<span aria-current="page">{{crumb_current}}</span></nav></div><div class="pf-frame" data-cursor="drag"><div class="pf-stage" aria-label="{{rail_label}}" tabindex="0">{{#slides}}<figure class="pf-slide{{?video}} is-video{{/}}" data-title="{{title}}" data-thumb="{{thumb}}">{{?src}}<img src="{{src}}" alt="{{alt}}"{{?eager}} loading="eager" fetchpriority="high"{{/}}{{^eager}} loading="lazy"{{/}}>{{/}}{{?video}}<video src="{{video}}" poster="{{poster}}" muted loop playsinline preload="metadata" aria-label="{{alt}}"></video>{{/}}{{^src}}{{^video}}<span class="pf-slot img-slot"><span class="img-slot-copy"><strong>{{label}}</strong><span>{{alt}}</span></span></span>{{/}}{{/}}</figure>{{/}}</div><button class="pf-next" type="button" aria-label="نمونهٔ بعدی"><span class="pf-next-thumb" aria-hidden="true"></span><span class="pf-next-copy"><small>نمونهٔ بعد</small><b class="pf-next-title"></b></span><svg aria-hidden="true"><use href="#icon-chevron-left"></use></svg></button></div><div class="content-shell pf-copy"><div class="pf-dots">{{#slides}}<button type="button" aria-label="نمونهٔ {{@}}"></button>{{/}}</div>{{?eyebrow}}<p class="pf-eyebrow">{{eyebrow}}</p>{{/}}<h1 class="pf-title" data-split>{{title}}</h1>{{?lead}}<p class="pf-lead">{{lead}}</p>{{/}}<div class="pf-actions"><a class="primary-button" href="{{primary.href}}"><span>{{primary.label}}</span><svg class="pf-arrow" aria-hidden="true"><use href="#icon-arrow-left"></use></svg></a>{{?share}}<button type="button" class="pf-ghost" data-done="{{share.done}}"><span>{{share.label}}</span></button>{{/}}</div><div class="pf-plates" aria-live="polite">{{#slides}}<dl class="pf-plate"{{?placeholder}} data-placeholder="hero"{{/}}><div><span class="icon-badge"><svg aria-hidden="true"><use href="#icon-portfolio"></use></svg></span><dt>{{service}}</dt><dd>خدمت</dd></div><div><span class="icon-badge"><svg aria-hidden="true"><use href="#icon-location"></use></svg></span><dt>{{client}}</dt><dd>{{city}}</dd></div><div><span class="icon-badge"><svg aria-hidden="true"><use href="#icon-user"></use></svg></span><dt>{{year}}</dt><dd>{{role}}</dd></div></dl>{{/}}</div></div></header>
