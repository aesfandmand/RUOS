rules:
  - id: RU-ARCH-2026-08-09-001
    statement: "خانواده «طراحی و برندینگ» در معماری جدید معتبر نیست؛ نام و مالک کانونیکال خانواده «طراحی گرافیک» است. استراتژی برند/مشاوره برند زیر Consulting و هویت بصری زیر Graphic Design قرار می‌گیرد."
    status: locked
  - id: RU-ARCH-2026-08-09-002
    statement: "هر تابلو/سازه ثبت‌شده باید به‌صورت Structure Detail مستقل زیر /structures/ در رجیستری سازه ثبت شود؛ STR-DETAIL-* فقط Pattern است و جایگزین رجیستری صریح صفحات نیست."
    status: locked
  - id: RU-ARCH-2026-08-09-003
    statement: "یک/دوطرفه، نوردهی و سایر ویژگی‌های فنی Variant/Data هستند مگر آنکه خودِ محصول در رجیستری تاییدشده به‌عنوان صفحه مستقل ثبت شده باشد."
    status: locked
  - id: RU-ARCH-2026-08-09-004
    statement: "منابع قدیمی که با معماری v2/v2.1 تعارض دارند حق Override ندارند و باید deprecated تلقی شوند."
    status: locked

