  - id: CEP-008
    name_fa: توسعه بازار صنعتی
    entry_signal: "نمایشگاه، صادرات، کاتالوگ، سایت"
    likely_personas: [PERSONA-005]
    natural_pages: ["/solutions/industrial-b2b/", "Sales enablement"]

  - id: CEP-009
    name_fa: Monetize دارایی
    entry_signal: "زمین، پل، فضای شهری/تجاری، سازه"
    likely_personas: [PERSONA-006]
    natural_pages: ["/structures/ → /investment/", Projects]
