uid: ENG-000001
type: engine
name: Reasoning Engine
status: active
version: 2.1.0
source_language: fa
scope:
  - website
  - instagram
  - multi-project
actors:
  human:
    responsibilities: [vision, business_decision, approval]
  ai:
    responsibilities: [analysis, generation, evaluation, recommendation]
  agent:
    responsibilities: [execution, monitoring, synchronization]
inputs:
  required: [project_uid, business_goal, audience_uid, output_type]
  optional: [industry_uid, query_uid, intent_uid, journey_stage, constraints]
reasoning_pipeline:
  - id: RST-01
    name: resolve_context
    output: context_snapshot
  - id: RST-02
    name: retrieve_rules
    order: [global, industry, project, page]
    output: effective_rules
  - id: RST-03
    name: retrieve_graph
    output: relevant_subgraph
  - id: RST-04
    name: generate_options
    minimum_options: 2
    output: candidate_options
  - id: RST-05
    name: score_options
    criteria: [business_fit, user_fit, search_fit, conversion_fit, brand_fit, feasibility, risk]
    output: scored_options
  - id: RST-06
    name: select_recommendation
    output: recommendation
  - id: RST-07
    name: request_human_approval
    required_when: [strategy_change, locked_rule_conflict, unsupported_claim, budget_commitment, publication]
  - id: RST-08
    name: emit_decision_record
    output: decision_record
hard_rules:
  - id: RUL-REASON-001
    rule: AI may recommend but must not make final business decisions.
  - id: RUL-REASON-002
    rule: Agents may execute only approved plans.
  - id: RUL-REASON-003
    rule: Every recommendation must cite graph nodes, rules, assumptions and evidence.
  - id: RUL-REASON-004
    rule: Project overrides may supersede core rules only when explicitly registered and versioned.
  - id: RUL-REASON-005
    rule: Persian is the source language until the Persian output is approved.
outputs: [decision_record, recommendation_package, unresolved_questions, evidence_map, risk_register]
qc:
  required_fields: [trace_id, project_uid, inputs, applied_rules, graph_references, assumptions, candidates, selected_option, confidence, risks, approval_status]
