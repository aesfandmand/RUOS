uid: ENG-000013
type: engine
name: RUOS API Layer
status: active
version: 3.0.0-alpha.3
source_language: fa
purpose:
  fa: فراهم‌کردن قرارداد استاندارد برای ارتباط موتورهای RUOS، داشبوردها، Agentها و یکپارچه‌سازی‌های بیرونی
api_styles:
  - rest
  - event_driven
  - internal_command
required_capabilities:
  - entity_read
  - entity_write
  - workflow_start
  - workflow_status
  - package_install
  - configuration_resolve
  - audit_read
hard_rules:
  - id: API-001
    rule: Every write request must include actor, project_uid and trace_id.
  - id: API-002
    rule: Locked entities require approval evidence before mutation.
  - id: API-003
    rule: API responses must preserve UID and version metadata.
  - id: API-004
    rule: Secrets must never be returned in API responses.
outputs:
  - command_result
  - query_result
  - validation_error
  - audit_reference
