uid: TPL-000201
type: template
name: Decision Record Schema
status: active
version: 2.1.0
source_language: fa
required:
  - trace_id
  - project_uid
  - created_at
  - actor
  - decision_type
  - inputs
  - applied_rules
  - graph_references
  - candidates
  - selected_option
  - rationale
  - confidence
  - risks
  - approval_status
properties:
  actor:
    enum: [human, ai, agent]
  decision_type:
    enum: [strategy, architecture, content, seo, ux, ui, technical, publication]
  approval_status:
    enum: [draft, needs_review, approved, rejected, superseded]
  confidence:
    type: number
    minimum: 0
    maximum: 1
  evidence:
    type: array
  assumptions:
    type: array
  unresolved_questions:
    type: array
