uid: RUL-000305
type: rule_set
name: Global Persian Writing Standard
status: active
version: 1.0.0
source_language: fa
scope: global

purpose:
  fa: استاندارد پایه نگارش فارسی روان، کوئری‌محور، پرسونا‌محور و قابل‌فهم برای موتورهای جست‌وجو و هوش مصنوعی

rules:
  - id: GWR-001
    rule: متن باید به فارسی روان، طبیعی و غیرترجمه‌زده نوشته شود.
  - id: GWR-002
    rule: عنوان، H1، ساختار و واژگان باید با کوئری واقعی کاربر هم‌راستا باشند.
  - id: GWR-003
    rule: متن باید با پرسونا، زبان او و مرحله سفر او تطبیق داده شود.
  - id: GWR-004
    rule: کاربر قهرمان است و برند نقش راهنما، طراح مسیر و مجری پاسخگو را دارد.
  - id: GWR-005
    rule: جزئیات ملموس، مثال و اثبات باید جایگزین صفت و ادعای کلی شوند.
  - id: GWR-006
    rule: جمله اول هر بخش کوتاه باشد و هیچ پاراگرافی بیش از چهار جمله نباشد، مگر شکست آگاهانه ریتم.
  - id: GWR-007
    rule: هر صفحه باید ساختار قابل استخراج برای گوگل و موتورهای هوش مصنوعی داشته باشد.
  - id: GWR-008
    rule: عنوان سئو حداکثر 60 نویسه و متادیسکریپشن بین 150 تا 160 نویسه باشد.
  - id: GWR-009
    rule: هر صفحه فقط یک H1 داشته باشد.
  - id: GWR-010
    rule: متن بدون عبور از ممیزی کاربر، سئو، خوانایی و هوش مصنوعی منتشر نشود.

forbidden_patterns:
  - ما به شما کمک می‌کنیم تا
  - در دنیای امروز
  - نه‌تنها… بلکه
  - اجازه دهید
  - این بدان معناست که
  - ما اینجاییم تا
  - خط تیره بلند بی‌جا

preferred_vocabulary:
  lead: سرنخ فروش
  CTA: دعوت به اقدام
  content: محتوا
  ROI: بازگشت سرمایه
  OOH: تبلیغات محیطی

approval:
  global_principles_approved_by: Red Umbrella owner
  approved_at: 2026-08-05
  note: سبک نهایی برند چتر قرمز پس از تایید نهایی مالک، مرجع ارتقای نسخه‌های بعدی این استاندارد خواهد بود.

