name: RUOS Engine CI

on:
  push:
    paths:
      - "src/ruos/**"
      - "pages/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/engine-ci.yml"
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: pytest -q
      - name: Compile structures
        run: ruos build structures
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: structures-sprint-1
          path: dist/structures
