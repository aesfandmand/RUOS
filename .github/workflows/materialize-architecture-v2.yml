name: Materialize architecture v2 workbook

on:
  push:
    branches:
      - fix/architecture-v2-binary
    paths:
      - .github/workflows/materialize-architecture-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify XLSX
        shell: bash
        run: |
          set -euo pipefail
          target='11-projects/red-umbrella/registries/چتر_قرمز_معماری_و_رجیستری_سایت_v2.xlsx'
          mkdir -p "$(dirname "$target")"
          cat .ruos-upload/architecture-v2/part-* | tr -d '\r\n' | base64 --decode > "$target"
          actual="$(sha256sum "$target" | awk '{print $1}')"
          expected='4d0ca7fccedfb994a3ad4c25bd7853fa79109e50685b997af5213f1b0ca0a414'
          test "$actual" = "$expected"
          unzip -t "$target"
          test "$(stat -c %s "$target")" -eq 38999

      - name: Commit materialized workbook and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ruos-upload/architecture-v2
          rm -f .github/workflows/materialize-architecture-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(architecture): materialize verified v2 registry workbook'
          git push origin HEAD:fix/architecture-v2-binary
