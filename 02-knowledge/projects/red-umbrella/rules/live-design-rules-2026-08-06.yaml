version: 2
status: locked-live
project: red-umbrella
updated_at: 2026-08-06
scope:
  - all_new_pages
  - all_redesigns
  - all_ruos_generated_outputs
rules:
  - id: RU-LIVE-2026-08-06-01
    priority: critical
    title: product-page-reference-is-primary-layout-source
    statement: >-
      هر صفحه محصولی که کاربر ارسال می‌کند، منبع اصلی یادگیری برای نوع فونت، مقیاس تایپوگرافی،
      چیدمان اجزا، ترتیب سکشن‌ها، ریتم فاصله‌گذاری، تراکم اطلاعات و الگوی ارائه محصول است.
      سیستم حق ندارد این مرجع را با دانش عمومی، قالب آماده یا سلیقه پیش‌فرض خود جایگزین کند.
    enforcement:
      - extract_typography
      - extract_section_order
      - extract_component_hierarchy
      - extract_spacing_rhythm
      - extract_product_information_architecture
      - block_build_when_reference_not_reviewed

  - id: RU-LIVE-2026-08-06-02
    priority: critical
    title: ban-red-black-hero-combination
    statement: >-
      ترکیب غالب قرمز و سیاه در هیرو، پس‌زمینه تیره با هاله قرمز، گرادیان قرمز-مشکی،
      یا هر ترکیب بصری هم‌خانواده برای پروژه چتر قرمز ممنوع است. رنگ قرمز فقط به‌عنوان اکسنت محدود،
      کنترل‌شده و غیرغالب قابل استفاده است؛ نه به‌عنوان فضای اصلی هیرو.
    forbidden_patterns:
      - black_hero_with_red_glow
      - red_black_gradient
      - dominant_dark_hero_with_red_objects
      - cinematic_red_black_palette
    enforcement:
      - fail_visual_gate
      - fail_art_direction_gate
      - fail_brand_gate

  - id: RU-LIVE-2026-08-06-03
    priority: critical
    title: live-rules-must-be-consulted-before-new-work
    statement: >-
      پیش از هر طراحی، بازطراحی، تولید HTML، تولید PageSpec، انتخاب پالت، فونت، موشن، کامپوننت یا
      چیدمان، آخرین فایل قانون زنده پروژه باید خوانده و اعمال شود. خروجی‌ای که بدون خواندن قانون زنده
      ساخته شود مردود است.
    enforcement:
      - require_live_rules_loaded
      - record_live_rules_sha_in_build_manifest
      - block_build_without_live_rules_provenance

  - id: RU-LIVE-2026-08-06-04
    priority: high
    title: tablonamvar-research-reference
    source:
      url: https://tablonamvar.com/%D8%AA%D8%A7%D8%A8%D9%84%D9%88-%D8%AA%D8%A8%D9%84%DB%8C%D8%BA%D8%A7%D8%AA%DB%8C/
      role: market-and-content-reference
    statement: >-
      صفحه «تابلو تبلیغاتی» نامور باید از بالا تا پایین برای ایده‌گیری اولیه در معماری اطلاعات،
      دسته‌بندی محصولات، ترتیب معرفی، نقاط اعتماد، پرسش‌های متداول، معرفی کاربردها، مسیر تماس و
      عمق محتوای محصول بررسی شود. این مرجع برای کپی مستقیم طراحی یا متن نیست؛ فقط برای استخراج
      منطق ارائه، پوشش موضوعی و شکاف‌های رقابتی استفاده می‌شود.
    extracted_observations:
      - ناوبری محصول‌محور با تفکیک فضای داخلی، فضای خارجی، دستگاه‌های تبلیغاتی و تابلو مغازه
      - دسته‌بندی روشن محصولات در چند خانواده و لینک‌دهی مستقیم به صفحات محصول
      - معرفی ابتدا خانواده‌های اصلی و سپس محصولات هر خانواده
      - CTA مستقیم برای مشاهده قیمت در سطح هر محصول
      - بخش مستقل «چرا محصولات ما بهترند» با متریال، LED، نصب، گارانتی و ارزش بلندمدت
      - FAQ عملی درباره پیش‌نمایش، LED، سفارشی‌سازی، طول عمر و نصب شهرستان
      - محتوای آموزشی تکمیلی برای لایت‌باکس ایستاده، توتم، کاربردها و طراحی مهندسی
      - استفاده از سابقه، تجهیزات، طراحی مهندسی و نصب به‌عنوان اعتمادساز
    usage_constraints:
      - do_not_copy_text
      - do_not_copy_visual_design
      - verify_claims_before_use
      - treat_unverified_statistics_as_untrusted

  - id: RU-LIVE-2026-08-06-05
    priority: high
    title: content-and-design-must-follow-approved-reference
    statement: >-
      پس از دریافت صفحه محصول مرجع از کاربر، طراحی جدید باید با آن از نظر فونت، سلسله‌مراتب، ترتیب
      سکشن‌ها و ریتم بصری تطبیق داده شود. هر اختلاف عمده باید قبل از تولید نهایی مستند و توجیه شود.
    enforcement:
      - require_reference_comparison
      - require_section_order_map
      - require_typography_map
      - require_visual_diff_review

  - id: RU-LIVE-2026-08-06-06
    priority: critical
    title: no-generic-template-output
    statement: >-
      خروجی نباید مجموعه‌ای از کارت‌های تکراری، هیروی عمومی، فونت پیش‌فرض یا سکشن‌های مستقل و بی‌روایت
      باشد. صفحه باید یک ساختار یکپارچه، محصول‌محور، قابل‌خواندن و مبتنی بر مرجع تأییدشده داشته باشد.
    enforcement:
      - reject_repetitive_card_wall
      - reject_unapproved_font
      - reject_disconnected_sections
      - reject_generic_hero

  - id: RU-LIVE-2026-08-06-07
    priority: critical
    title: digikala-product-page-is-approved-layout-and-reading-reference
    source:
      url: https://www.digikala.com/product/dkp-16497186/%D8%AA%D8%A7%D8%A8%D9%84%D9%88-%D8%A2%D8%AA%D8%B1%DB%8C%D8%B3%D8%A7-%D8%B7%D8%B1%D8%AD-%D9%86%D8%A6%D9%88%D9%86-%D9%85%D8%AF%D9%84-atne062/
      title: تابلو آتریسا طرح نئون مدل ATNE062
      role: approved-product-layout-reading-and-hierarchy-reference
    statement: >-
      این صفحه محصول دیجی‌کالا مرجع تأییدشده کاربر برای یادگیری معماری صفحه محصول، ریتم خواندن،
      سلسله‌مراتب اطلاعات، نسبت گالری و اطلاعات محصول، جایگاه خرید یا اقدام، ترتیب مشخصات، نقد و بررسی،
      پرسش‌ها، نظرات، محصولات مرتبط و چگونگی شکستن محتوای طولانی به بلوک‌های قابل اسکن است.
      از این مرجع باید منطق ارائه و خوانایی استخراج شود، نه رنگ سازمانی، هدر، فوتر یا هویت بصری دیجی‌کالا.
    required_extraction_map:
      - product_breadcrumb_and_category_context
      - product_media_gallery_and_thumbnail_behavior
      - product_title_brand_and_identity_hierarchy
      - short_feature_summary_near_primary_information
      - primary_action_or_commercial_panel_position
      - trust_delivery_and_service_signals
      - anchored_or_sticky_section_navigation
      - introduction_and_expert_review
      - structured_specification_groups
      - user_questions_and_answers
      - user_reviews_and_rating_summary
      - related_and_similar_products
      - mobile_reordering_and_sticky_primary_action
      - dense_but_scannable_typography
    layout_principles_to_adapt:
      - product_media_and_product_information_must_share_the_first_decision_view
      - essential_information_precedes_long_form_explanation
      - commercial_action_stays_visible_without_dominating_reading
      - specifications_use_grouped_rows_not_long_unstructured_paragraphs
      - long_page_has_clear_section_landmarks_and_local_navigation
      - user_generated_proof_is_separated_from_brand_claims
      - related_items_appear_after_primary_decision_information
      - mobile_order_prioritizes_identity_media_key_facts_action_then_depth
    typography_principles_to_adapt:
      - use_one_consistent_persian_ui_family
      - favor_medium_and_bold_weights_for_labels_and_titles
      - keep_body_text_compact_readable_and_high_contrast
      - use restrained_size_steps_instead_of_exaggerated_display_headlines
      - use whitespace_and_dividers_to_express_hierarchy
      - avoid decorative_font_switching_inside_product_information
    forbidden_copying:
      - do_not_copy_digikala_header
      - do_not_copy_digikala_footer
      - do_not_copy_digikala_brand_colors
      - do_not_copy_marketplace_seller_logic_when_not_relevant
      - do_not_copy_text_or_product_claims
    enforcement:
      - require_digikala_reference_map_in_product_page_artifact
      - require_first_view_product_decision_composition
      - require_grouped_specifications
      - require_mobile_section_order_review
      - reject_unstructured_long_form_product_page
      - reject_oversized_marketing_hero_on_product_pages
